name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  CYPRESS_INSTALL_BINARY: "0"

jobs:
  js:
    name: web + admin — type-check + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm lint
      # Full `next build` is intentionally left to the deploy platform (Vercel),
      # which supplies the runtime env. CI keeps the fast, env-free correctness gates.

  backend:
    name: backend — build + vet + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/backend/go.mod
          cache-dependency-path: services/backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # The money-safety guard harness (source-level claim-before-settlement +
      # CORS behaviour) is behind a build tag so it stays out of the default
      # suite — run it explicitly so those guards gate every push (F2).
      - run: go test -tags money_safety_repro ./...
