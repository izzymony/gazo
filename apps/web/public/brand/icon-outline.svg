<svg width="999" height="781" viewBox="0 0 999 781" fill="none" xmlns="http://www.w3.org/2000/svg">
<!--
  The brand mark as an OUTLINE: brand fill, brand-deep stroke.

  Geometry is copied verbatim from icon-yellow.svg - only fill/stroke differ.
  If the mark ever changes, regenerate this from that file rather than editing
  the path data here.

  This is the "brand colour used illustratively" treatment: a yellow mark on a
  yellow ground is invisible without an edge, so it carries a brand-deep
  outline. Stroke is sized for a 200-400px render.

  Hex rather than var(): an external SVG has no access to the page's custom
  properties. brand #FFE500, brand-deep #665C00 - both from tokens.cjs.
-->
