<svg viewBox="-110 -110 1318 1100" fill="none" xmlns="http://www.w3.org/2000/svg">
<!--
  The brand mark as the three-layer lockup from Figma (node 73:8989): two
  echoes behind it, then the mark in brand yellow with a black outline.

  The SAME two paths three times, copied verbatim from icon-yellow.svg. The
  echoes are the mark grown outward by a thick round-joined stroke in its own
  colour, so each hugs the silhouette rather than drifting off it at the
  corners.

  Figma strokes the mark OUTSIDE the path; SVG only centres a stroke. So the
  outline is drawn as a filled+stroked halo underneath and the yellow is laid
  over it: the fill keeps the path's full size and the black sits entirely
  outside, which is what makes the counters read fat rather than pinched.

  Values read off the Figma source rather than guessed - the echoes are black
  at 10% and 15%, stacked, and the outline is pure black, not brand-deep. The
  three widths were then measured back out of a render and matched against the
  same measurement of Figma's.

  Regenerate from icon-yellow.svg if the mark ever changes.
-->
<g fill="#000000" stroke="#000000" stroke-linejoin="round" stroke-linecap="round">
  <g opacity="0.1" stroke-width="598">
    <path d="M774.211 256.429C714.026 181.2 616.448 181.2 556.264 256.429L532.309 286.373L665.237 452.533L798.166 286.373L774.211 256.429Z"/>
    <path d="M441.901 256.422C381.717 181.193 284.139 181.193 223.955 256.422L200 286.366L390.111 524.003C450.295 599.232 547.873 599.232 608.057 524.003L632.012 494.059L441.901 256.422Z"/>
  </g>
