<!--
  The Vibaar mark as a decorative watermark: brand fill with a brand-deep
  outline, per the illustration rule (a brand-yellow mark used illustratively
  carries a deep edge, or it dissolves into a yellow ground).

  GEOMETRY IS COPIED FROM icon-yellow.svg AND MUST STAY IN STEP WITH IT.
  It lives here rather than inline in a component because that is exactly how
  the OLD Instashop mark survived the rebrand: it was hand-inlined in
  HeaderSlides, recoloured to the brand variable, and so passed every colour
  gate while still being the wrong logo.

  NOTE: an XML comment may not contain a double hyphen. Writing a CSS custom
  property here by name breaks the parse, and a broken SVG fails silently as a
  zero-width image.
-->
