name: CI Pipeline for Next.js (TypeScript)

on:
  # Run the workflow when pushing to main/master or creating a pull request
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - '**'  # Run on PRs targeting any branch

jobs:
  linting:
    name: Linting
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Setup Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run ESLint for linting
      - name: Run ESLint
        run: npm run lint

  type-check:
    name: TypeScript Check
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Setup Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: TypeScript compile check (real type gate via tsc --noEmit, not a full build)
      - name: Run TypeScript
        run: npm run type-check

  build-and-validate:
    name: Build and Validate
    runs-on: ubuntu-latest
    needs: [linting, type-check]

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Setup Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run Webpack build (Webpack must be part of your Next.js setup)
      - name: Run Webpack Build
        run: npm run build

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-validate]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Deploy using Vercel (for example)
      - name: Deploy to Vercel
        run: npx vercel --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
