<!DOCTYPE html>
<html>
<head>
    <title>CORS Test</title>
</head>
<body>
    <h1>CORS Test for Instashop Backend</h1>
    <button onclick="testCORS()">Test CORS Request</button>
    <div id="result"></div>

    <script>
        async function testCORS() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing CORS...';

            try {
                // Test the exact endpoint the frontend is calling
                const response = await fetch('https://instashop-backend.onrender.com/api/v1/business', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer test-token-here' // You would put a real token here
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `<h3>SUCCESS!</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
                } else {
                    resultDiv.innerHTML = `<h3>Response Error: ${response.status}</h3><p>${response.statusText}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<h3>CORS Error:</h3><p>${error.message}</p>`;
                console.error('CORS Error:', error);
            }
        }

        // Also test a simple preflight request
        async function testPreflight() {
            try {
                const response = await fetch('https://instashop-backend.onrender.com/api/v1/business', {
                    method: 'OPTIONS'
                });
                console.log('Preflight response:', response.status, response.headers);
            } catch (error) {
                console.error('Preflight error:', error);
            }
        }

        // Test preflight on page load
        testPreflight();
    </script>
</body>
</html>
